services:
  - type: web
    name: spraycash
    runtime: node
    region: oregon
    plan: free
    rootDir: web
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RELAYER_PRIVATE_KEY
        sync: false
